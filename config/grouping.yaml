# Descriptions (docs/GROUPING.md §0, rule 3): phrases that describe a listing and are no model.
# A phrase made only of such words is never mined as a model, and a listing that has no model
# but has one of them goes to the group of that description ("Baggy · Pants", slug _desc-baggy).
# Titles keep the words: "Neck Logo" is still found, and a seed or a confirmed group can make
# any of them a model (Paris sneakers). An entry is a phrase or {name, aliases, only_types,
# except_types}; the scope is a taxonomy type id. Do not list words the title normalizer drops
# (colors, noise, product-type words such as "crew neck", "denim"); a test checks that.
