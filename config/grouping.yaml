# Size markers drop the marker and the next size token ("size 45", "EU 42", "JP 17.5").
size_markers: [size, sz, sizes, eu, us, uk, it, fr, jp, cm, waist, inseam, tagged, measures]
# Standalone tokens that are always sizes ("3xl" is a Balenciaga model, so it is kept).
size_tokens: [xxs, xs, xl, xxl, xxxl, 2xl, 4xl, 5xl, os, osfa, one size]
# Letter sizes removed only right after a size marker.
size_letters: [s, m, l, small, medium, large, xsmall, xlarge]

# Kept modifiers that make a listing a version inside a line ("Mega Geobasket").
protected_modifiers: [double, triple, mega, jumbo, tiny, baby, mini, micro, big, super, ultra]
# Version numbers right after a model ("Track 2", "Speed 3"); larger numbers are sizes.
version_numbers: [2, 3, 4]
