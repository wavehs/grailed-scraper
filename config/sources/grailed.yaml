source: grailed
schema_version: 2
indices:
  active: Listing_production
  active_sorted_by_date: Listing_by_date_added_production
  sold: Listing_sold_production
facets:
  brand: designers.name
  category: category_path
fields:
  grailed_id:      ["id", "objectID"]
  url:             ["url", "permalink"]
  title:           ["title"]
  description:     ["description"]
  brand_name:      ["designers[0].name", "designer_names[0]"]
  brand_slug:      ["designers[0].slug"]
  designer_names:  ["designers[*].name"]
  category:        ["category", "category_path"]
  subcategory:     ["subcategory", "category_path"]
  category_path:   ["category_path"]
  size:            ["size"]
  condition:       ["condition"]
  color:           ["color", "traits[color]"]
  product_id:      ["product_id"]
  sku_id:          ["sku_id"]
  repost_id:       ["repost_id"]
  price_float:     ["price", "price_i"]
  sold_price:      ["sold_price"]
  currency:        ["currency", "_default:USD"]
  likes_count:     ["followerno", "hearts_count", "hearts", "_default:0"]
  created_at:      ["created_at", "created_at_i"]
  sold_at:         ["sold_at", "sold_at_i"]
  updated_at:      ["updated_at", "updated_at_i"]
  cover_photo_url: ["cover_photo.url", "photos[0].url"]
  photo_urls:      ["photos[*].url"]
  photo_count:     ["photo_count"]
  seller_id:       ["user.id", "seller.id"]
  seller_username: ["user.username", "seller.username"]
  sticker:         ["sticker", "sticker.type"]
  location:        ["location", "seller.country"]
  # Market fields (columns since 0022; none of them identifies a seller).
  price_drops:         ["price_drops"]
  price_updated_at:    ["price_updated_at"]
  bumped_at:           ["bumped_at"]
  sold_shipping_price: ["sold_shipping_price"]
  ship_domestic:       ["shipping.us.amount"]
  makeoffer:           ["makeoffer"]
  buynow:              ["buynow"]
  department:          ["department"]
  seller_rating_avg:   ["user.seller_score.rating_average"]
  seller_rating_count: ["user.seller_score.rating_count"]
  seller_txn_count:    ["user.total_bought_and_sold"]
  seller_trusted:      ["user.trusted_seller"]
conditions:
  is_new: "is_new"
  is_gently_used: "is_gently_used"
  is_used: "is_used"
  is_worn: "is_worn"
  is_not_specified: "is_not_specified"
