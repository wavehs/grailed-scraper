# Product type taxonomy for grouping-v6: the single dictionary of product types.
#
# A listing's type comes from its Grailed `category_path` (`department.subcategory`).
# - `categories` maps every known path to one type, or to a mixed rule
#   `{any: [...], fallback: type}` that is refined by title words (first listed type wins).
# - A path missing here falls back to its department in `departments`.
# - Title words are written naturally; they are normalized like titles (case, accents,
#   plurals). Multi-word phrases win over single words ("trucker jacket" over "trucker").
#   `weak` words only refine a mixed category when no regular word is present.
# - A clear category whose title names only types from other families and other
#   sections (a hat titled "pendant") goes to `review` instead of a wrong group.
#
# Live check of real paths: `python -m app.cli taxonomy-check` (bounded, one request).
version: taxonomy-v1

