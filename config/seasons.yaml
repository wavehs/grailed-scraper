# Wardrobe season presets (v2 plan 3.3): the trends page's 🍂/❄️/🌱/☀️ buttons filter these
# product types and switch to the season's last finished period.
#
# Generated by `python -m app.cli seasons-suggest` (type SI_rel >= 1.15 over all departments,
# 2026-10-15, about 11 months of sales), then edited by hand:
# - autumn: accessory_other dropped (a mixed bucket, not a wardrobe item);
# - winter: bracelet and glasses dropped (gift-season peak of one year, not the weather).
# Rerun the command once two full years of sales are collected and review the lists.
# Kept apart from taxonomy.yaml: that file is part of the grouping digest.
seasons:
  autumn:
    - parka  # SI_rel 1.86, 77 sales
    - coat  # SI_rel 1.29, 67 sales
    - bomber  # SI_rel 1.28, 88 sales
    - leather_jacket  # SI_rel 1.26, 201 sales
    - sweater  # SI_rel 1.24, 257 sales
    - sweatshirt  # SI_rel 1.20, 76 sales
  winter:
    - bomber  # SI_rel 1.39, 134 sales
    - parka  # SI_rel 1.30, 78 sales
    - coat  # SI_rel 1.28, 95 sales
    - sweatpants  # SI_rel 1.23, 528 sales
    - light_jacket  # SI_rel 1.19, 268 sales
  spring:
    - glasses  # SI_rel 1.36, 72 sales
    - tank  # SI_rel 1.33, 147 sales
    - shorts  # SI_rel 1.22, 449 sales
    - blazer  # SI_rel 1.19, 51 sales
    - tshirt  # SI_rel 1.16, 1183 sales
  summer:
    - shorts  # SI_rel 1.25, 475 sales
    - sandals  # SI_rel 1.19, 135 sales
