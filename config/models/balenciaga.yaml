models:
  - {name: Track, types: [lowtop_sneakers, hitop_sneakers, sandals]}
  - {name: Track 2, aliases: [track2], types: [lowtop_sneakers], parent: Track}
  - {name: Track Runner, types: [lowtop_sneakers], parent: Track}
  - {name: Triple S, aliases: [triples], types: [lowtop_sneakers, hitop_sneakers]}
  - {name: Speed, aliases: [speed trainer], types: [lowtop_sneakers, hitop_sneakers, slip_ons, boots]}
  - {name: Runner, types: [lowtop_sneakers]}
  - {name: 3XL, types: [lowtop_sneakers]}
  - {name: 10XL, types: [lowtop_sneakers]}
  - {name: Defender, types: [lowtop_sneakers]}
  - {name: Arena, types: [hitop_sneakers, lowtop_sneakers]}
  - {name: Bulldozer, types: [boots]}
  - {name: Tractor, types: [boots, shoes]}
  - {name: Knife, types: [boots, heels]}
  - {name: Le Cagole, aliases: [cagole], types: [bag]}
  - {name: Hourglass, types: [bag]}
  - {name: City, types: [bag]}
  - {name: Political Campaign, aliases: [campaign], types: any}
  - {name: Speedhunters, aliases: [speed hunters], types: any}
  # Real models that a brand mark or a description would otherwise cut: Paris is a model only
  # for sneakers (docs/GROUPING.md §0, rule 2), Cargo for sneakers, Metal for tops.
  - {name: Paris, types: [lowtop_sneakers, hitop_sneakers]}
  - {name: Cargo, types: [lowtop_sneakers, hitop_sneakers]}
  - {name: Metal, types: [hoodie, tshirt, longsleeve]}
  # Fragments that no rule can lift to their line: Mud (a wash), Trompe (a word).
  - {name: Mud Show, aliases: [mudshow], types: any}
  - {name: Trompe L'Oeil, aliases: [trompe, trompe loeil, tromp loeil, trompe l oeil], types: any}

# Marks of the brand: never a model on their own, a description of the brandmark class.
# A seed above still wins (Paris sneakers), titles keep these words ("Paris Moon", "Neck Logo").
generic:
  - paris
  - maison
  - homme
  - demna
  - gvasalia
  - ghesquiere
  - nicolas
  - bal
  - poetic
  - BB
  - BB Signature
  - BB Mode

# Collaborations (class `collab` of eval/balenciaga/codesigners.csv). A listing without a model
# whose title names the partner or an alias goes to the line `_collab-<partner>` of its type.
# The names are brand terms, so they never stay in titles as model words. `designers` (Grailed
# designer names) only feed `grouping-report --collabs`; they never place a listing.
collabs:
  - name: Yeezy Gap
    aliases: [yeezy gap, ygebb, yzy gap, engineered by balenciaga, yeezy x gap, yzy x gap,
      gap x yeezy, yezzy gap, yeezygap, engineered balenciaga, engineered by balanciaga]
    designers: [Gap, Yeezy, Yeezy Gap, Kanye West]
  - {name: Adidas, designers: [Adidas]}
  - {name: Under Armour, aliases: [under armor], designers: [Under Armour]}
  # "Crocs" folds to "croc", the word for croc-embossed leather: only footwear, never
  # "croc embossed" and the like.
  - name: Crocs
    designers: [Crocs]
    only_sections: [footwear]
    not_before: [embossed, effect, leather, print, skin, pattern]
  - {name: Puma, designers: [Puma]}
  - {name: Gucci, designers: [Gucci]}
  # Unverified collaboration (codesigners.csv note); kept on the list until labels say otherwise.
  - {name: Lamborghini, designers: [Lamborghini]}
  - {name: eBay, designers: [eBay]}
  - {name: PlayStation, designers: [Playstation]}
  - {name: Vibram, designers: [Vibram]}
  - {name: The Simpsons, aliases: [simpsons], designers: [The Simpsons]}
  - {name: NBA, designers: [NBA]}
  - {name: Colette, designers: [Colette]}
  - {name: 10 Corso Como, designers: [10 Corso Como]}
