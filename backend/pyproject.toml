[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
strict = true
warn_unused_configs = true
exclude = ["^alembic/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider --basetemp=.test-tmp -m 'not browser and not integration'"
asyncio_mode = "auto"
markers = [
  "browser: requires locally installed browser dependencies",
  "integration: exercises an external service",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured 74% on 2026-10-06. Raise the floor as coverage grows; never lower it to land a change.
fail_under = 73
skip_covered = true
show_missing = true
